name: Publicar

# Publicação MANUAL no GitHub Pages: aba Actions -> "Publicar" -> "Run workflow".
# O pipeline de dados não roda aqui (downloads grandes); o workflow só verifica e publica site/.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar site/ (caminhos locais, sourcemaps, tamanhos, créditos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checagem de publicação
        run: python scripts/checar_publicacao.py

  publicar:
    name: Publicar no GitHub Pages
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
